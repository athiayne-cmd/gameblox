<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0020"/>
      <stop offset="50%" stop-color="#1a0040"/>
      <stop offset="100%" stop-color="#2a0055"/>
    </linearGradient>
    <linearGradient id="ad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa33ff"/>
      <stop offset="50%" stop-color="#ff33cc"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <linearGradient id="ad-mark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b00ff"/>
      <stop offset="100%" stop-color="#ff00c8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b00ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b00ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff00c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff00c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="1280" height="720" fill="url(#ad-bg)"/>

  <!-- Halos lumineux -->
  <circle cx="180" cy="160" r="420" fill="url(#glow1)"/>
  <circle cx="1150" cy="580" r="450" fill="url(#glow2)"/>

  <!-- Grille pixels en bas-gauche (effet "Blox") -->
  <g opacity="0.6">
    <rect x="40"  y="600" width="20" height="20" rx="3" fill="#ffd700"/>
    <rect x="65"  y="600" width="20" height="20" rx="3" fill="#00d4ff"/>
    <rect x="40"  y="625" width="20" height="20" rx="3" fill="#00d4ff"/>
    <rect x="65"  y="625" width="20" height="20" rx="3" fill="#ffd700"/>
    <rect x="90"  y="625" width="20" height="20" rx="3" fill="#ff00c8"/>
    <rect x="40"  y="650" width="20" height="20" rx="3" fill="#ff00c8"/>
    <rect x="65"  y="650" width="20" height="20" rx="3" fill="#8b00ff"/>
    <rect x="90"  y="650" width="20" height="20" rx="3" fill="#ffd700"/>
  </g>

  <!-- Badge GRATUIT -->
  <g transform="translate(60, 60)">
    <rect width="220" height="64" rx="32" fill="#ffd700"/>
    <text x="110" y="44" font-family="Rajdhani, 'Arial Black', Impact, sans-serif"
          font-size="28" font-weight="900" fill="#000" text-anchor="middle"
          letter-spacing="2">100% GRATUIT</text>
  </g>

  <!-- Surtitre -->
  <text x="640" y="220"
        font-family="Rajdhani, 'Arial Black', Impact, sans-serif"
        font-size="44" font-weight="800" fill="#ffffff"
        text-anchor="middle" letter-spacing="6" opacity="0.85">
    ACHÈTE  •  VENDS  •  ÉCHANGE
  </text>

  <!-- Headline principal ligne 1 -->
  <text x="640" y="350"
        font-family="Rajdhani, 'Arial Black', Impact, sans-serif"
        font-size="120" font-weight="900" fill="#ffffff"
        text-anchor="middle" letter-spacing="-2">
    DU GAMING
  </text>

  <!-- Headline principal ligne 2 (gradient) -->
  <text x="640" y="470"
        font-family="Rajdhani, 'Arial Black', Impact, sans-serif"
        font-size="120" font-weight="900" fill="url(#ad-text)"
        text-anchor="middle" letter-spacing="-2">
    AU SÉNÉGAL
  </text>

  <!-- Sous-titre -->
  <text x="640" y="540"
        font-family="Rajdhani, 'Arial Black', Impact, sans-serif"
        font-size="32" font-weight="700" fill="#ffffff"
        text-anchor="middle" letter-spacing="3" opacity="0.75">
    PS5 · XBOX · SWITCH · ACCESSOIRES · JEUX
  </text>

  <!-- Logo + nom en bas -->
  <g transform="translate(440, 605)">
    <!-- Mini icône G -->
    <rect width="80" height="80" rx="18" fill="url(#ad-mark-bg)"/>
    <text x="40" y="62" font-family="Rajdhani, 'Arial Black', Impact, sans-serif"
          font-size="60" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>
    <rect x="58" y="56" width="8" height="8" rx="1" fill="#ffd700"/>
    <rect x="68" y="56" width="8" height="8" rx="1" fill="#00d4ff"/>
    <rect x="58" y="66" width="8" height="8" rx="1" fill="#00d4ff"/>
    <rect x="68" y="66" width="8" height="8" rx="1" fill="#ffd700"/>

    <!-- Wordmark -->
    <text x="100" y="62"
          font-family="Rajdhani, 'Arial Black', Impact, sans-serif"
          font-size="56" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">GAME</tspan><tspan fill="url(#ad-text)">BLOX</tspan>
    </text>
  </g>
</svg>
