<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b00ff"/>
      <stop offset="100%" stop-color="#ff00c8"/>
    </linearGradient>
    <linearGradient id="gb-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fond app-icon style -->
  <rect width="512" height="512" rx="110" fill="url(#gb-bg)"/>
  <rect width="512" height="512" rx="110" fill="url(#gb-shine)"/>

  <!-- Liseré subtil -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Lettre G -->
  <text x="200" y="380"
        font-family="Rajdhani, 'Arial Black', Impact, 'Helvetica Neue', sans-serif"
        font-size="380" font-weight="900" fill="#ffffff"
        text-anchor="middle" letter-spacing="-8">G</text>

  <!-- 4 pixels (rappel "Blox") -->
  <g>
    <rect x="350" y="350" width="48" height="48" rx="6" fill="#ffd700"/>
    <rect x="406" y="350" width="48" height="48" rx="6" fill="#00d4ff"/>
    <rect x="350" y="406" width="48" height="48" rx="6" fill="#00d4ff"/>
    <rect x="406" y="406" width="48" height="48" rx="6" fill="#ffd700"/>
  </g>
</svg>
